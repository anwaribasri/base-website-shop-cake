    <style>
        
        body {
            background: linear-gradient(
                180deg,
                orange,
                white,
                rgb(20, 123, 20)
            );
            text-align: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .menu-kue {
             grid-template-columns: repeat(4 ,1fr);
             display: grid;
             padding: 10px;
             margin: 20 auto;
             flex-direction: row;
             gap: 20px;
        }

       .card {
        width: 80%;
        border: 2px solid black;
        padding: 5px;
        border-radius: 7px;
        box-sizing: border-box;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

        transition: 0.3s;
        cursor: pointer;
        transition: all 0.3s ease;
        transition: transform 0.3s ease,
                    box-shadow 0.3s ease;
  animation: muncul 0.8s ease forwards;
       }

       .card img {
        width: 100%;
        height: 180px;
        border-radius: 10px;
        object-fit: cover;
       }

       .card:active {
    transform: scale(0.95);
}

.card.dipilih {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    border-color: #ff9800;
}

.card:hover {
    transform: translateY(-10px) scale(1.03);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
}

.checkout {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 600px;
  box-sizing: border-box;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;

  padding: 18px 20px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 20px;
  box-shadow: 0 8px 30px #00000020;
  z-index: 1000;
}

.checkout-info {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.checkout-label {
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  color: #777777;
}

.checkout-info h3 {
  margin: 0;
  font-size: 22px;
  color: #202020;
}

.checkout button {
  border: none;
  border-radius: 12px;
  padding: 14px 18px;
  background: #00a86b;
  color: white;
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
  cursor: pointer;
  transition: 0.2s ease;
}

.checkout button:hover {
  background: #008f5b;
  transform: translateY(-2px);
}

.checkout button:active {
  transform: scale(0.97);
}

.menu-kue {
  padding-bottom: 110px;
}

@media (max-width: 480px) {
  .checkout {
    bottom: 10px;
    width: calc(100% - 20px);
    padding: 14px;
    gap: 10px;
    border-radius: 16px;
  }

  .checkout-info h3 {
    font-size: 19px;
  }

  .checkout button {
    padding: 13px 14px;
    font-size: 12px;
  }
}

.onclick {
  background-color: black;
  color: white;
}

    </style>
</head>
